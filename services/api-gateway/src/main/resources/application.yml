server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service-route
              uri: http://localhost:9000
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: orders-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
